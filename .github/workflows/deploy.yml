name: deploy

# Deploys (or diffs) the Picket stack from a phone-friendly "Run workflow" button.
# Credentials come from repository secrets; see docs/OPERATIONS.md.
on:
  workflow_dispatch:
    inputs:
      action:
        description: What to do
        type: choice
        default: deploy
        options: [deploy, diff]

permissions:
  id-token: write # for the optional OIDC role
  contents: read

concurrency:
  group: picket-aws
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  STACK: Picket
  DOMAIN_NAME: ${{ vars.DOMAIN_NAME || 'picket.photos' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: "infra/package-lock.json" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      - name: Pick credential mode
        id: mode
        env:
          ROLE: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          KEY: ${{ secrets.AWS_ACCESS_KEY_ID }}
        run: |
          if [ -n "$ROLE" ]; then echo "mode=oidc" >> "$GITHUB_OUTPUT";
          elif [ -n "$KEY" ]; then echo "mode=keys" >> "$GITHUB_OUTPUT";
          else echo "::error::Set AWS_DEPLOY_ROLE_ARN (OIDC) or AWS_ACCESS_KEY_ID + AWS_SECRET_ACCESS_KEY in repository secrets"; exit 1; fi
      - name: AWS credentials (OIDC role)
        if: steps.mode.outputs.mode == 'oidc'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: AWS credentials (access keys)
        if: steps.mode.outputs.mode == 'keys'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - run: npm ci
        working-directory: services/api
      - run: npm ci
        working-directory: infra

      - name: Resolve DNS for ${{ env.DOMAIN_NAME }}
        id: dns
        run: |
          set -euo pipefail
          # Two modes. Route 53: a hosted zone for the domain exists in this account (we never create one).
          # External (Netlify, ...): no zone; records are added by hand from the summary, and the API
          # certificate is requested here so its validation record can be shown without blocking the deploy.
          mode=external; zone_id=""; delegated=false; zone_ns=""; cert_arn=""; cert_status="none"; cert_cname_name=""; cert_cname_value=""
          if zones="$(aws route53 list-hosted-zones-by-name --dns-name "$DOMAIN_NAME." --max-items 1 \
                --query "HostedZones[?Name=='${DOMAIN_NAME}.'].Id" --output text 2>&1)"; then
            zid="$(printf '%s' "$zones" | sed 's|/hostedzone/||' | tr -d '[:space:]')"
            if [ -n "$zid" ] && [ "$zid" != "None" ]; then
              mode=route53; zone_id="$zid"
              zone_ns="$(aws route53 get-hosted-zone --id "$zone_id" --query 'DelegationSet.NameServers' --output text | tr '\t' '\n' | sed 's/\.$//' | sort)"
              public_ns="$(dig +short NS "$DOMAIN_NAME" @1.1.1.1 2>/dev/null | sed 's/\.$//' | sort || true)"
              [ -n "$public_ns" ] && [ "$public_ns" = "$zone_ns" ] && delegated=true
            fi
          else
            echo "::notice::Could not list Route 53 zones (${zones}); using external DNS mode"
          fi
          if [ "$mode" = external ]; then
            arn="$(aws acm list-certificates --certificate-statuses PENDING_VALIDATION ISSUED \
              --query "CertificateSummaryList[?DomainName=='api.${DOMAIN_NAME}'].CertificateArn | [0]" --output text 2>/dev/null || echo None)"
            if [ -z "$arn" ] || [ "$arn" = "None" ]; then
              echo "Requesting an ACM certificate for api.$DOMAIN_NAME"
              if ! arn="$(aws acm request-certificate --domain-name "api.$DOMAIN_NAME" --validation-method DNS --idempotency-token picketapi --query CertificateArn --output text 2>&1)"; then
                echo "::warning::Could not request the API certificate (${arn}); continuing without a custom API domain"; arn=""
              else
                sleep 10  # the validation record appears a few seconds after the request
              fi
            fi
            if [ -n "$arn" ]; then
              desc="$(aws acm describe-certificate --certificate-arn "$arn")"
              cert_status="$(printf '%s' "$desc" | jq -r .Certificate.Status)"
              cert_cname_name="$(printf '%s' "$desc" | jq -r '.Certificate.DomainValidationOptions[0].ResourceRecord.Name // ""')"
              cert_cname_value="$(printf '%s' "$desc" | jq -r '.Certificate.DomainValidationOptions[0].ResourceRecord.Value // ""')"
              [ "$cert_status" = "ISSUED" ] && cert_arn="$arn"
            fi
          fi
          {
            echo "mode=$mode"; echo "zone_id=$zone_id"; echo "delegated=$delegated"
            echo "cert_arn=$cert_arn"; echo "cert_status=$cert_status"
            echo "cert_cname_name=$cert_cname_name"; echo "cert_cname_value=$cert_cname_value"
            printf 'ns<<EOF\n%s\nEOF\n' "$zone_ns"
          } >> "$GITHUB_OUTPUT"
          echo "mode=$mode zone=$zone_id delegated=$delegated cert=$cert_status"

      - name: CDK context
        id: ctx
        run: |
          if [ "${{ steps.dns.outputs.mode }}" = "route53" ]; then
            echo "args=-c domainName=$DOMAIN_NAME -c hostedZoneId=${{ steps.dns.outputs.zone_id }} -c dnsDelegated=${{ steps.dns.outputs.delegated }}" >> "$GITHUB_OUTPUT"
          else
            arn="${{ steps.dns.outputs.cert_arn }}"
            echo "args=-c domainName=$DOMAIN_NAME${arn:+ -c apiCertificateArn=$arn}" >> "$GITHUB_OUTPUT"
          fi

      - name: Bootstrap CDK (idempotent)
        if: inputs.action == 'deploy'
        working-directory: infra
        run: npx cdk bootstrap

      - name: cdk diff
        if: inputs.action == 'diff'
        working-directory: infra
        run: npx cdk diff ${{ steps.ctx.outputs.args }} 2>&1 | tee "$GITHUB_STEP_SUMMARY"

      - name: cdk deploy
        if: inputs.action == 'deploy'
        working-directory: infra
        run: npx cdk deploy --require-approval never --outputs-file outputs.json ${{ steps.ctx.outputs.args }}

      - name: Netlify DNS (external mode)
        if: inputs.action == 'deploy' && steps.dns.outputs.mode == 'external'
        id: netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          out() { jq -r ".${STACK}.$1" infra/outputs.json; }
          if [ -z "$NETLIFY_AUTH_TOKEN" ]; then
            echo "managed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::NETLIFY_AUTH_TOKEN not set; the summary lists the DNS records to add by hand"
            exit 0
          fi
          dns=infra/scripts/netlify-dns.sh
          {
            echo "## Netlify DNS"
            echo '```'
            $dns upsert "$DOMAIN_NAME" A "ftp.$DOMAIN_NAME" "$(out ReceiverIp)" 300
            cn="${{ steps.dns.outputs.cert_cname_name }}"; cv="${{ steps.dns.outputs.cert_cname_value }}"
            [ -z "$cn" ] || $dns upsert "$DOMAIN_NAME" CNAME "$cn" "$cv" 300
            echo '```'
          } > netlify-summary.md
          cat netlify-summary.md

          # Wait for the API certificate to validate, then attach the custom domain in this same run.
          arn="${{ steps.dns.outputs.cert_arn }}"
          if [ -z "$arn" ] && [ -n "$cn" ]; then
            cand="$(aws acm list-certificates --certificate-statuses PENDING_VALIDATION ISSUED \
              --query "CertificateSummaryList[?DomainName=='api.${DOMAIN_NAME}'].CertificateArn | [0]" --output text)"
            for i in $(seq 1 24); do
              st="$(aws acm describe-certificate --certificate-arn "$cand" --query Certificate.Status --output text)"
              echo "certificate: $st"
              [ "$st" = "ISSUED" ] && { arn="$cand"; break; }
              sleep 30
            done
          fi
          if [ -n "$arn" ] && [ "$(out ApiDomainTarget)" = "(no custom domain yet)" ]; then
            echo "Attaching api.$DOMAIN_NAME"
            (cd infra && npx cdk deploy --require-approval never --outputs-file outputs.json -c domainName="$DOMAIN_NAME" -c apiCertificateArn="$arn")
          fi
          tgt="$(out ApiDomainTarget)"
          if [ "$tgt" != "(no custom domain yet)" ]; then
            { echo '```'; $dns upsert "$DOMAIN_NAME" CNAME "api.$DOMAIN_NAME" "$tgt" 300; echo '```'; } >> netlify-summary.md
            echo "api_attached=true" >> "$GITHUB_OUTPUT"
          else
            echo "The API certificate is still validating; run deploy again later to attach api.$DOMAIN_NAME (the default URL works meanwhile)." >> netlify-summary.md
            echo "api_attached=false" >> "$GITHUB_OUTPUT"
          fi
          echo "managed=true" >> "$GITHUB_OUTPUT"

      - name: Issue an app pairing code
        if: inputs.action == 'deploy'
        run: |
          set -euo pipefail
          out() { jq -r ".${STACK}.$1" infra/outputs.json; }
          raw="$(tr -dc 'A-HJ-NP-Z2-9' </dev/urandom | head -c 8)"
          code="${raw:0:4}-${raw:4:4}"
          expires="$(date -u -d '+30 minutes' +%Y-%m-%dT%H:%M:%SZ)"
          aws secretsmanager put-secret-value --secret-id "$(out PairingSecret)" --secret-string "{\"code\":\"$code\",\"expiresAt\":\"$expires\"}" >/dev/null
          echo "PAIRING_CODE=$code" >> "$GITHUB_ENV"
          echo "PAIRING_EXPIRES=$expires" >> "$GITHUB_ENV"

      - name: Summary
        if: inputs.action == 'deploy'
        run: |
          out() { jq -r ".${STACK}.$1" infra/outputs.json; }
          {
            echo "## Picket deployed to \`$AWS_REGION\`"
            echo
            echo "| output | value |"
            echo "|---|---|"
            for k in ApiUrl FtpHost ReceiverIp FtpUser Domain ApiDomainTarget LightroomClientId Bucket Table ReceiverInstanceId UploaderLogGroup UploadDlqUrl; do
              v="$(out $k)"; [ "$v" = "null" ] || echo "| \`$k\` | \`$v\` |"
            done
            echo
            echo "## Pair the app"
            echo
            echo "Settings → API URL \`$(out ApiUrl)\` → pairing code **$PAIRING_CODE** (valid until $PAIRING_EXPIRES UTC, one use). Need another later: ops → pairing-code."
            echo
            if [ "${{ steps.netlify.outputs.managed }}" = "true" ]; then
              cat netlify-summary.md
              echo
              echo "DNS records are managed on Netlify by this workflow. The receiver fetches its Let's Encrypt certificate within ~15 minutes of \`ftp.$DOMAIN_NAME\` resolving."
            else
              echo "## DNS"
              echo
              if [ "${{ steps.dns.outputs.mode }}" = "route53" ]; then
                if [ "${{ steps.dns.outputs.delegated }}" = "true" ]; then
                  echo "\`$DOMAIN_NAME\` is delegated to the Route 53 zone; records are managed by the stack."
                else
                  echo "\`$DOMAIN_NAME\` is not yet delegated to the Route 53 zone. Set these name servers at the registrar, then run deploy again:"
                  echo '```'; echo "${{ steps.dns.outputs.ns }}"; echo '```'
                fi
              else
                echo "DNS for \`$DOMAIN_NAME\` is external (Netlify). Add the \`NETLIFY_AUTH_TOKEN\` secret to let this workflow manage the records, or add them in Netlify → Domains → \`$DOMAIN_NAME\` → DNS settings:"
                echo
                echo "| type | name | value | why |"
                echo "|---|---|---|---|"
                echo "| A | \`ftp\` | \`$(out ReceiverIp)\` | the camera's FTPS host; the receiver fetches a Let's Encrypt certificate once this resolves |"
                cn="${{ steps.dns.outputs.cert_cname_name }}"; cv="${{ steps.dns.outputs.cert_cname_value }}"
                if [ -n "$cn" ]; then echo "| CNAME | \`${cn%.}\` | \`${cv%.}\` | proves to AWS that you own \`api.$DOMAIN_NAME\` (certificate status: ${{ steps.dns.outputs.cert_status }}) |"; fi
                tgt="$(out ApiDomainTarget)"
                if [ "$tgt" != "(no custom domain yet)" ]; then
                  echo "| CNAME | \`api\` | \`$tgt\` | the app's API at https://api.$DOMAIN_NAME |"
                fi
              fi
            fi
            echo
            echo "The receiver needs ~3 minutes after a fresh deploy to finish installing pure-ftpd."
          } >> "$GITHUB_STEP_SUMMARY"
