name: deploy

# Deploys (or diffs) the Picket stack from a phone-friendly "Run workflow" button.
# Credentials come from repository secrets; see docs/OPERATIONS.md.
on:
  workflow_dispatch:
    inputs:
      action:
        description: What to do
        type: choice
        default: deploy
        options: [deploy, diff]

permissions:
  id-token: write # for the optional OIDC role
  contents: read

concurrency:
  group: picket-aws
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  STACK: Picket

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: "infra/package-lock.json" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      - name: Pick credential mode
        id: mode
        env:
          ROLE: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          KEY: ${{ secrets.AWS_ACCESS_KEY_ID }}
        run: |
          if [ -n "$ROLE" ]; then echo "mode=oidc" >> "$GITHUB_OUTPUT";
          elif [ -n "$KEY" ]; then echo "mode=keys" >> "$GITHUB_OUTPUT";
          else echo "::error::Set AWS_DEPLOY_ROLE_ARN (OIDC) or AWS_ACCESS_KEY_ID + AWS_SECRET_ACCESS_KEY in repository secrets"; exit 1; fi
      - name: AWS credentials (OIDC role)
        if: steps.mode.outputs.mode == 'oidc'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: AWS credentials (access keys)
        if: steps.mode.outputs.mode == 'keys'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - run: npm ci
        working-directory: services/api
      - run: npm ci
        working-directory: infra

      - name: Bootstrap CDK (idempotent)
        if: inputs.action == 'deploy'
        working-directory: infra
        run: npx cdk bootstrap

      - name: cdk diff
        if: inputs.action == 'diff'
        working-directory: infra
        run: npx cdk diff 2>&1 | tee "$GITHUB_STEP_SUMMARY"

      - name: cdk deploy
        if: inputs.action == 'deploy'
        working-directory: infra
        run: npx cdk deploy --require-approval never --outputs-file outputs.json

      - name: Apply secrets from GitHub
        if: inputs.action == 'deploy'
        env:
          FTP_PASSWORD: ${{ secrets.PICKET_FTP_PASSWORD }}
          API_TOKEN: ${{ secrets.PICKET_API_TOKEN }}
        run: |
          set -euo pipefail
          out() { jq -r ".${STACK}.$1" infra/outputs.json; }
          summary=()
          if [ -n "$FTP_PASSWORD" ]; then
            cur="$(aws secretsmanager get-secret-value --secret-id "$(out FtpPasswordSecret)" --query SecretString --output text)"
            if [ "$cur" != "$FTP_PASSWORD" ]; then
              aws secretsmanager put-secret-value --secret-id "$(out FtpPasswordSecret)" --secret-string "$FTP_PASSWORD" >/dev/null
              echo "FTP password updated from PICKET_FTP_PASSWORD; reloading on the receiver"
              iid="$(out ReceiverInstanceId)"
              # The receiver may still be running cloud-init right after a fresh deploy; wait for the agent, then for the script.
              for i in $(seq 1 30); do
                aws ssm describe-instance-information --filters "Key=InstanceIds,Values=$iid" --query 'InstanceInformationList[0].PingStatus' --output text 2>/dev/null | grep -q Online && break
                sleep 10
              done
              cmd=$(aws ssm send-command --instance-ids "$iid" --document-name AWS-RunShellScript --comment "picket: reload ftp password" \
                --parameters 'commands=["for i in $(seq 1 60); do [ -x /usr/local/bin/picket-set-ftp-password.sh ] && exec /usr/local/bin/picket-set-ftp-password.sh; sleep 10; done; echo script missing; exit 1"]' \
                --query Command.CommandId --output text)
              for i in $(seq 1 90); do
                st=$(aws ssm get-command-invocation --command-id "$cmd" --instance-id "$iid" --query Status --output text 2>/dev/null || echo Pending)
                case "$st" in Success) break;; Failed|Cancelled|TimedOut) echo "::error::ftp password reload $st"; exit 1;; esac
                sleep 10
              done
            fi
            summary+=("FTP password: from GitHub secret PICKET_FTP_PASSWORD")
          else
            summary+=("FTP password: AWS-generated; read it in the AWS console → Secrets Manager → $(out FtpPasswordSecret)")
          fi
          if [ -n "$API_TOKEN" ]; then
            cur="$(aws secretsmanager get-secret-value --secret-id "$(out ApiTokenSecret)" --query SecretString --output text)"
            [ "$cur" = "$API_TOKEN" ] || aws secretsmanager put-secret-value --secret-id "$(out ApiTokenSecret)" --secret-string "$API_TOKEN" >/dev/null
            summary+=("API token: from GitHub secret PICKET_API_TOKEN (the authorizer picks up changes within 5 minutes)")
          else
            summary+=("API token: AWS-generated; read it in the AWS console → Secrets Manager → $(out ApiTokenSecret)")
          fi
          printf '%s\n' "${summary[@]}" > secrets-summary.txt

      - name: Summary
        if: inputs.action == 'deploy'
        run: |
          out() { jq -r ".${STACK}.$1" infra/outputs.json; }
          {
            echo "## Picket deployed to \`$AWS_REGION\`"
            echo
            echo "| output | value |"
            echo "|---|---|"
            for k in ApiUrl ReceiverIp FtpUser LightroomClientId LightroomRedirectUri Bucket Table ReceiverInstanceId UploaderLogGroup UploadQueueUrl UploadDlqUrl; do
              v="$(out $k)"; [ "$v" = "null" ] || echo "| \`$k\` | \`$v\` |"
            done
            echo
            sed 's/^/- /' secrets-summary.txt
            echo
            echo "Camera: Host Name = ReceiverIp, User = FtpUser, Secure Protocol On, Passive On (docs/CAMERA_SETUP.md)."
            echo "App: Settings → API URL = ApiUrl, Token = API token → Connect Lightroom."
            echo "The receiver needs ~3 minutes after a fresh deploy to finish installing pure-ftpd."
          } >> "$GITHUB_STEP_SUMMARY"
