name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  infra:
    name: infra (cdk synth)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: "infra/package-lock.json" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: npm ci
        working-directory: services/api   # NodejsFunction resolves the API's deps lockfile
      - run: npm ci
        working-directory: infra
      - run: npm run build
        working-directory: infra
      - run: npm run synth
        working-directory: infra

  api:
    name: services/api
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: "services/api/package-lock.json" }
      - run: npm ci
        working-directory: services/api
      - run: npm run typecheck
        working-directory: services/api
      - run: npm test
        working-directory: services/api

  preview:
    name: services/preview
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements-dev.txt
        working-directory: services/preview
      # The real-ARW tests need a 70 MB download from raw.pixls.us; skip them in CI.
      - run: PICKET_OFFLINE=1 pytest -q
        working-directory: services/preview
      - run: ./build.sh /tmp/preview-dist
        working-directory: services/preview

  app:
    name: app (typecheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: "app/package-lock.json" }
      - run: npm ci
        working-directory: app
      - run: npm run typecheck
        working-directory: app
